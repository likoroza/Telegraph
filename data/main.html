<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        h1 {
            color: red;
        }

    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
</head>
<body>
    <h1>Settings!</h1>
    <form id="form" autocomplete="off">
        <div>
            <label for="led_output">Led Output:</label>
            <input id="led_output" name="led_output" type="checkbox">
        </div>
        
        <div>
            <label for="sound_output">Sound Output:</label>
            <input id="sound_output" name="sound_output" type="checkbox">
        </div>
        <div>
            <label for="dash_threshold">Dash Threshold:</label>
            <input type="number" name="dash_threshold" id="dash_threshold" value="150">
        </div>

        <div>
            <input type="submit" value="Submit">
        </div>
    </form>
    <script src="script.js">

            const form = document.getElementById("form");
            form.addEventListener('submit', function (event) {
                event.preventDefault()

                const formObject = {
                    led_output: form.led_output.checked,
                    sound_output: form.sound_output.checked,
                    dash_threshold: Number(form.dash_threshold.value)
                };


                const jsonString = JSON.stringify(formObject, null, 2);

                console.log(jsonString)
            })

    </script>
</body>
</html>`
